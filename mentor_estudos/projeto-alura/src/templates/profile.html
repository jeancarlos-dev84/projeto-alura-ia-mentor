{% extends 'base.html' %}
{% block content %}
<div class="text-center">
    <h2>Olá, {{ user_info.name }}!</h2>
    {% if user_info.picture %}
      <img src="{{ user_info.picture }}" class="rounded-circle my-2" width="100" height="100">
    {% endif %}
    <p class="mt-2">Pronto para começar seu estudo?</p>
    <a href="{{ url_for('estudar') }}" class="btn btn-main">Montar Cronograma de Estudos</a>
</div>
{% endblock %}
